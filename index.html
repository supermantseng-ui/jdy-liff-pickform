<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>掃碼領料</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --primary: #06843d;
    --primary-dark: #056030;
    --danger: #d32f2f;
    --bg: #f4f6f5;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  .screen { display: none; min-height: 100vh; flex-direction: column; padding: 16px; }
  .screen.active { display: flex; }

  h1 { font-size: 22px; margin: 8px 0 20px; text-align: center; }
  .subtitle { text-align: center; color: var(--muted); margin-bottom: 24px; font-size: 15px; }

  .big-btn {
    display: block;
    width: 100%;
    padding: 26px 16px;
    margin-bottom: 16px;
    font-size: 24px;
    font-weight: 700;
    border: none;
    border-radius: 16px;
    background: var(--primary);
    color: white;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
  }
  .big-btn:active { background: var(--primary-dark); }
  .big-btn.secondary { background: #ffffff; color: var(--primary); border: 2px solid var(--primary); }
  .big-btn.danger { background: var(--danger); }
  .big-btn.gray { background: #9ca3af; }

  .scan-btn {
    font-size: 30px;
    padding: 36px 16px;
    margin-bottom: 20px;
  }

  .item-card {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .item-info { flex: 1; min-width: 0; }
  .item-code { font-size: 15px; font-weight: 700; color: var(--muted); }
  .item-name { font-size: 18px; font-weight: 700; margin: 2px 0; word-break: break-all; }
  .item-meta { font-size: 14px; color: var(--muted); }
  .qty-input {
    width: 80px;
    font-size: 24px;
    text-align: center;
    padding: 10px 4px;
    border: 2px solid var(--primary);
    border-radius: 10px;
  }
  .del-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: #f3f4f6;
    color: var(--danger);
    font-size: 20px;
    font-weight: 700;
  }

  .status-bar {
    text-align: center;
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 16px;
    padding: 10px;
    background: #e8f5ec;
    border-radius: 10px;
    color: var(--primary-dark);
  }
  .empty-hint { text-align: center; color: var(--muted); margin: 40px 0; font-size: 16px; }

  .list-area { flex: 1; overflow-y: auto; margin-bottom: 16px; }
  .bottom-actions { position: sticky; bottom: 0; background: var(--bg); padding-top: 8px; }

  .msg-box {
    background: white;
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    margin: auto;
    max-width: 400px;
  }
  .msg-icon { font-size: 56px; margin-bottom: 12px; }
  .msg-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .msg-detail { color: var(--muted); font-size: 15px; margin-bottom: 20px; }

  .spinner {
    width: 48px; height: 48px; margin: 40px auto;
    border: 6px solid #ddd; border-top-color: var(--primary);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .dept-tag {
    display: inline-block;
    background: var(--primary);
    color: white;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .link-btn { color: var(--muted); font-size: 14px; text-decoration: underline; background: none; border: none; }
</style>
</head>
<body>

  <!-- 載入畫面 -->
  <div id="screen-loading" class="screen active">
    <div style="margin:auto; text-align:center;">
      <div class="spinner"></div>
      <div style="color:var(--muted); font-size:15px;">連線中，第一次啟動可能需要 20~30 秒...</div>
    </div>
  </div>

  <!-- 無權限 / 錯誤畫面 -->
  <div id="screen-error" class="screen">
    <div class="msg-box" style="margin-top:40vh;">
      <div class="msg-icon">🚫</div>
      <div class="msg-title" id="error-title">尚未開通使用權限</div>
      <div class="msg-detail" id="error-detail">請聯繫管理人員確認帳號權限</div>
    </div>
  </div>

  <!-- 選擇領料單位 -->
  <div id="screen-dept" class="screen">
    <h1>掃碼領料</h1>
    <div class="subtitle">請先選擇本次領料單位</div>
    <button class="big-btn" onclick="selectDept('西工')">西工</button>
    <button class="big-btn" onclick="selectDept('業務')">業務</button>
    <button class="big-btn" onclick="selectDept('行政')">行政</button>
  </div>

  <!-- 領料事由/工件代號 -->
  <div id="screen-note" class="screen">
    <div class="top-row">
      <span class="dept-tag" id="dept-tag-note">西工</span>
    </div>
    <h1 style="margin-top:0;">領料事由</h1>
    <div class="subtitle">工件代號、注意事項都可以填在這裡（選填）</div>
    <textarea id="note-input" placeholder="例如：工件代號 A123，急件..."
      style="width:100%; min-height:140px; font-size:22px; padding:16px; border:2px solid var(--primary); border-radius:14px; font-family:inherit; margin-bottom:8px;"></textarea>
    <div style="text-align:center; color:var(--muted); font-size:14px; margin-bottom:24px;">
      💡 可以直接點手機鍵盤上的麥克風圖示，用講的比較快
    </div>
    <button class="big-btn" onclick="goToScanFromNote()">開始掃描料號</button>
  </div>

  <!-- 掃碼與清單畫面 -->
  <div id="screen-scan" class="screen">
    <div class="top-row">
      <span class="dept-tag" id="dept-tag-scan">西工</span>
      <div>
        <button class="link-btn" onclick="goToNoteFromScan()">修改事由</button>
        <button class="link-btn" onclick="goToDeptScreen()">重新選擇單位</button>
      </div>
    </div>
    <button class="big-btn scan-btn" onclick="startScan()">📷 掃描料號</button>
    <div class="status-bar" id="status-count">已掃描 0 項</div>
    <div class="list-area" id="item-list">
      <div class="empty-hint">掃描料號後，項目會顯示在這裡</div>
    </div>
    <div class="bottom-actions">
      <button class="big-btn" id="btn-confirm" onclick="goToConfirm()" disabled>確認清單，準備送出</button>
    </div>
  </div>

  <!-- 確認畫面 -->
  <div id="screen-confirm" class="screen">
    <div class="top-row">
      <span class="dept-tag" id="dept-tag-confirm">西工</span>
    </div>
    <h1 style="margin-top:0;">請再次確認</h1>
    <div class="subtitle">確認以下項目及數量都正確無誤</div>
    <div class="list-area" id="confirm-list"></div>
    <div class="bottom-actions">
      <button class="big-btn" onclick="submitForm()">✅ 確認無誤，送出</button>
      <button class="big-btn secondary" onclick="goBackToScan()">返回修改</button>
    </div>
  </div>

  <!-- 送出中 -->
  <div id="screen-submitting" class="screen">
    <div style="margin:auto; text-align:center;">
      <div class="spinner"></div>
      <div style="color:var(--muted); font-size:16px;">送出中，請稍候...</div>
    </div>
  </div>

  <!-- 成功畫面 -->
  <div id="screen-success" class="screen">
    <div class="msg-box" style="margin-top:30vh;">
      <div class="msg-icon">✅</div>
      <div class="msg-title">送出成功</div>
      <div class="msg-detail">單號：<span id="success-doc-no">-</span></div>
      <button class="big-btn" onclick="resetAll()">繼續下一批領料</button>
    </div>
  </div>

  <!-- 失敗畫面 -->
  <div id="screen-fail" class="screen">
    <div class="msg-box" style="margin-top:30vh;">
      <div class="msg-icon">⚠️</div>
      <div class="msg-title">送出失敗</div>
      <div class="msg-detail" id="fail-detail">請稍後再試，或聯繫管理人員</div>
      <button class="big-btn" onclick="goBackToScan()">返回清單重試</button>
    </div>
  </div>

<script>
// ============================================================
// 設定區：以下三個常數，上線前務必換成實際的值
// ============================================================
const LIFF_ID = '2010616417-pG4yv5V0';               // ✅ 已設定
const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbwImI2HJ4B4mr-XoOXL49U2xpV9XtypuEyOzM7WzuzXF4ZhSmynOYup3p9whKb_MhV1QA/exec'; // ✅ 已設定
// ============================================================

let state = {
  lineUserId: null,
  applicantAccount: null,
  applicantName: null,
  department: null,
  note: '',
  items: [], // { code, name, unit, warehouse, qty }
};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function friendlyError_(err) {
  const msg = String(err && err.message || err);
  if (msg.includes('fetch') || msg.includes('abort')) {
    return '網路訊號不穩或連線逾時，請確認網路後再試一次';
  }
  return msg;
}

async function callApi(action, payload, retrying) {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 30000); // 30秒逾時：GAS首次冷啟動偶爾會超過20秒
    const res = await fetch(GAS_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...payload }),
      signal: controller.signal,
    });
    clearTimeout(timeoutId);
    return await res.json();
  } catch (err) {
    if (!retrying) {
      // 第一次失敗（常見於GAS冷啟動或現場訊號短暫不穩）自動重試一次，使用者感覺不到
      await new Promise(r => setTimeout(r, 800));
      return callApi(action, payload, true);
    }
    throw err; // 重試後仍失敗，才真正往外拋出讓畫面顯示錯誤
  }
}

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isInClient()) {
      document.getElementById('error-title').textContent = '請用LINE開啟此頁面';
      document.getElementById('error-detail').textContent = '這個功能需要在LINE App內使用才能掃描';
      showScreen('screen-error');
      return;
    }
    const profile = await liff.getProfile();
    state.lineUserId = profile.userId;

    const auth = await callApi('checkAuth', { lineUserId: state.lineUserId, displayName: profile.displayName });
    if (!auth.ok) {
      document.getElementById('error-title').textContent = '尚未開通使用權限';
      document.getElementById('error-detail').textContent = '請聯繫管理人員將您的LINE帳號加入領料掃碼名單';
      showScreen('screen-error');
      return;
    }
    state.applicantAccount = auth.account;
    state.applicantName = auth.name;
    showScreen('screen-dept');
  } catch (err) {
    document.getElementById('error-title').textContent = '連線發生問題';
    document.getElementById('error-detail').textContent = friendlyError_(err);
    showScreen('screen-error');
  }
}

function selectDept(dept) {
  state.department = dept;
  document.getElementById('dept-tag-note').textContent = dept;
  document.getElementById('dept-tag-scan').textContent = dept;
  document.getElementById('dept-tag-confirm').textContent = dept;
  document.getElementById('note-input').value = state.note || '';
  showScreen('screen-note');
}

function goToScanFromNote() {
  state.note = document.getElementById('note-input').value.trim();
  showScreen('screen-scan');
}

function goToDeptScreen() {
  showScreen('screen-dept');
}

function goToNoteFromScan() {
  document.getElementById('note-input').value = state.note || '';
  showScreen('screen-note');
}

async function startScan() {
  try {
    // scanCodeV2() 是LINE原生相機模組，理論上不會不回應，但保險起見包一層逾時，
    // 避免萬一真的卡住時，App整個看起來像當機、使用者不知道能不能重試
    const scanTimeout = new Promise((_, reject) =>
      setTimeout(() => reject(new Error('scan-timeout')), 25000)
    );
    const res = await Promise.race([liff.scanCodeV2(), scanTimeout]);
    const code = (res.value || '').trim();
    if (!code) return;
    showToast('查詢中...');
    await lookupAndAddItem(code);
    hideToast();
  } catch (err) {
    hideToast();
    if (err && err.message === 'scan-timeout') {
      alert('相機沒有反應，請直接再按一次「掃描料號」重試');
      return;
    }
    alert('掃描失敗：' + friendlyError_(err));
  }
}

let toastTimer = null;
function showToast(text) {
  let el = document.getElementById('scan-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'scan-toast';
    el.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:white;padding:16px 28px;border-radius:14px;font-size:17px;font-weight:700;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,0.3);pointer-events:none;';
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.style.display = 'block';
}
function hideToast() {
  const el = document.getElementById('scan-toast');
  if (el) el.style.display = 'none';
}

async function lookupAndAddItem(code) {
  const existing = state.items.find(i => i.code === code);
  if (existing) {
    // 同一個料號重複掃到，數量+1，比要求重新輸入更符合現場直覺
    existing.qty = (Number(existing.qty) || 0) + 1;
    renderList();
    return;
  }
  const result = await callApi('lookupItem', { code });
  if (!result.ok) {
    alert('查無此料號：' + code + '\n請確認QR標籤或聯繫管理人員');
    return;
  }
  state.items.push({
    code: result.item.code,
    name: result.item.name,
    unit: result.item.unit,
    warehouse: result.item.warehouse,
    qty: 1,
  });
  renderList();
}

function renderList() {
  const listEl = document.getElementById('item-list');
  const countEl = document.getElementById('status-count');
  const confirmBtn = document.getElementById('btn-confirm');

  countEl.textContent = `已掃描 ${state.items.length} 項`;
  confirmBtn.disabled = state.items.length === 0;

  if (state.items.length === 0) {
    listEl.innerHTML = '<div class="empty-hint">掃描料號後，項目會顯示在這裡</div>';
    return;
  }

  listEl.innerHTML = state.items.map((item, idx) => `
    <div class="item-card">
      <div class="item-info">
        <div class="item-code">${item.code}　${item.warehouse || ''}</div>
        <div class="item-name">${item.name}</div>
        <div class="item-meta">單位：${item.unit || '-'}</div>
      </div>
      <input class="qty-input" type="number" inputmode="decimal" value="${item.qty}"
             onchange="updateQty(${idx}, this.value)">
      <button class="del-btn" onclick="removeItem(${idx})">✕</button>
    </div>
  `).join('');
}

function updateQty(idx, val) {
  // 允許負數：掃錯/選錯時可以直接輸入負數來沖銷、逆轉，不用整批刪掉重掃
  const n = Number(val);
  state.items[idx].qty = isNaN(n) ? 0 : n;
}

function removeItem(idx) {
  state.items.splice(idx, 1);
  renderList();
}

function goToConfirm() {
  const listEl = document.getElementById('confirm-list');
  listEl.innerHTML = state.items.map(item => `
    <div class="item-card">
      <div class="item-info">
        <div class="item-code">${item.code}　${item.warehouse || ''}</div>
        <div class="item-name">${item.name}</div>
        <div class="item-meta">單位：${item.unit || '-'}</div>
      </div>
      <div style="font-size:22px; font-weight:700;">x ${item.qty}</div>
    </div>
  `).join('');
  showScreen('screen-confirm');
}

function goBackToScan() {
  showScreen('screen-scan');
}

async function submitForm() {
  showScreen('screen-submitting');
  try {
    const result = await callApi('submitPickList', {
      department: state.department,
      applicantAccount: state.applicantAccount,
      applicantName: state.applicantName,
      note: state.note,
      lines: state.items.map(i => ({
        code: i.code, name: i.name, unit: i.unit, warehouse: i.warehouse, qty: i.qty,
      })),
    });
    if (result.ok) {
      document.getElementById('success-doc-no').textContent = result.docNo || '(未取得單號)';
      showScreen('screen-success');
    } else {
      document.getElementById('fail-detail').textContent = result.reason || '未知錯誤';
      showScreen('screen-fail');
    }
  } catch (err) {
    document.getElementById('fail-detail').textContent = String(err && err.message || err);
    showScreen('screen-fail');
  }
}

function resetAll() {
  state.items = [];
  state.department = null;
  state.note = '';
  renderList(); // 清空畫面上殘留的舊清單，不然要等下次掃碼才會刷新
  showScreen('screen-dept');
}

init();
</script>
</body>
</html>
